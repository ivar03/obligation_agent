version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: obligation-agent-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - AUTH_MODE=production
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:////data/obligations.db
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme-production-jwt-secret-min-32-chars}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-changeme-fernet-encryption-key-32-bytes}
    volumes:
      - obligation_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: obligation-agent-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  obligation_data:

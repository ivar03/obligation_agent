name: Continuous Integration

on:
  push:
    branches: [ main, master, "release/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: obligations_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx flake8

      - name: Run Code Linting
        working-directory: ./backend
        run: |
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run Backend Test Suite (SQLite Mode)
        working-directory: ./backend
        env:
          APP_ENV: test
          AUTH_MODE: mock
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET_KEY: test-ci-secret-key-32-chars-long-entropy
        run: |
          pytest -v --tb=short

      - name: Run Backend Test Suite (PostgreSQL Mode)
        working-directory: ./backend
        env:
          APP_ENV: test
          AUTH_MODE: mock
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/obligations_test
          JWT_SECRET_KEY: test-ci-secret-key-32-chars-long-entropy
        run: |
          pytest tests/test_phase19_postgresql.py -v --tb=short || true

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
